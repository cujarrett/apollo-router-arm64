name: CD

on:
  pull_request:
  push:
    branches: [main]
  # Rebuilds an older version from main, such as the one the cluster still pins.
  workflow_dispatch:
    inputs:
      version:
        description: Router version to build. Empty means the Dockerfile version.
        type: string
        default: ""

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      router: ${{ steps.version.outputs.router }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          INPUT: ${{ inputs.version }}
        run: echo "router=${INPUT:-$(sed -n 's/^ARG ROUTER_VERSION=//p' Dockerfile)}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # A PR builds but never pushes, so a Renovate bump proves the version compiles before it merges.
    uses: cujarrett/homelab/.github/workflows/build-image.yml@main
    with:
      image: ghcr.io/cujarrett/apollo-router-arm64
      tags: |
        ghcr.io/cujarrett/apollo-router-arm64:${{ needs.version.outputs.router }}
        ghcr.io/cujarrett/apollo-router-arm64:sha-${{ github.sha }}
      build-args: ROUTER_VERSION=${{ needs.version.outputs.router }}
      cache-scope: apollo-router-arm64
      check-only: ${{ github.ref != 'refs/heads/main' }}
