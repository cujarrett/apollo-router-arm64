name: CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    # Native arm64, so the Rust build runs at full speed with no emulation.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: echo "router=$(sed -n 's/^ARG ROUTER_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A PR builds but never pushes, so a Renovate bump proves the version compiles
      # before it merges. The cargo layer is cached between runs.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/cujarrett/apollo-router-arm64:${{ steps.version.outputs.router }}
            ghcr.io/cujarrett/apollo-router-arm64:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v4.1.2
        if: github.ref == 'refs/heads/main'

      # Signed by digest, so Kyverno can verify it the same way it verifies subgraphs.
      - if: github.ref == 'refs/heads/main'
        run: cosign sign --yes ghcr.io/cujarrett/apollo-router-arm64@${{ steps.build.outputs.digest }}
